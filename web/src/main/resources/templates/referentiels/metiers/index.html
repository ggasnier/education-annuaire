<!DOCTYPE html>
<html layout:decorate="~{layout/default}"

      xmlns:th="http://www.thymeleaf.org">

<head>
</head>

<body>
<th:block layout:fragment="content">
    <h1> Métiers</h1>


    <ul>

        </li>
    </ul>

</th:block>
</body>
</html>
