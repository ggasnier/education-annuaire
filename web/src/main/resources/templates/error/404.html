<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/default}">

<head>
    <title>Page non trouvée</title>
</head>

<body>
<th:block layout:fragment="content">
    <div class="container mx-auto px-4 py-16">
        <div class="flex flex-col items-center justify-center min-h-screen -mt-32">
            <!-- Error Card -->
            <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-8">
                <div class="flex flex-col items-center">
                    <!-- 404 Icon -->
                    <div class="text-6xl font-bold text-gray-300 mb-4">404</div>

                    <!-- Error Message -->
                    <h1 class="text-2xl font-bold text-gray-900 mb-4 text-center">
                        Page non trouvée
                    </h1>

                    <p class="text-center text-gray-600 mb-8">
                        Désolé, la page que vous recherchez n'existe pas ou a été supprimée.
                    </p>

                    <!-- Error ID (if available) -->
                    <div class="w-full bg-gray-50 rounded p-4 mb-6" th:if="${errorId}">
                        <p class="text-xs text-gray-500 font-semibold mb-1">ID Erreur</p>
                        <p class="text-sm font-mono text-gray-700 break-all" th:text="${errorId}">
                            ERR-00000000-0000-0000-0000-000000000000
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="w-full flex flex-col gap-3">
                        <a href="/" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
                           py-2 px-4 rounded text-center transition duration-200">
                            Retour à l'accueil
                        </a>
                        <a href="/recherche" class="w-full border-2 border-blue-600 text-blue-600
                           hover:bg-blue-50 font-semibold py-2 px-4 rounded text-center transition duration-200">
                            Aller à la recherche
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>

</html>
